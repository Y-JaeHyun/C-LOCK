<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600&family=Limelight&family=Nanum+Brush+Script&display=swap">
<link rel="stylesheet" href="../engine/engine.css">
<style>
/* TIME CASINO clue surfaces (shown in clue / lock sheets) */
/* clue surfaces */
.paper { background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 18px 20px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.chalk { background: #203a2f; color: #f1eee4; border: 10px solid #6b4426; border-radius: 6px; padding: 18px; font-family: var(--f-hand); }
.chalk h3 { margin: 0 0 10px; font-size: 30px; font-weight: 700; }
.chalk .rows { display: flex; flex-direction: column; gap: 10px; font-family: var(--f-mono); font-size: 14px; }
.chalk .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chalk .g { color: #ffd98a; font-weight: 600; min-width: 64px; }
.chalk .st { border: 1px dashed rgba(241,238,228,.35); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
.chalk .res { color: #9fe0b8; }
.blank { color: #ffb38a; font-weight: 600; }
.roul { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.roul .c { background: #241612; border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.roul .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.roul .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #8a7a6a; }
.roul .c.live .dot { background: transparent; }
.roul .c.dead .dot { background: var(--bad); border-color: var(--bad); }
.roul .t { font-size: 13px; }
.roul .c.dead .t { color: var(--bad); font-weight: 600; }
@media (max-width: 520px) { .roul { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.board { background: #f7f3ea; border: 8px solid #151010; border-radius: 6px; padding: 18px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.board .ttl { color: #b3261e; font-size: 13px; letter-spacing: .2em; }
.board .letters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.board .letters span { font-family: var(--f-arcade); font-size: 34px; color: #151010; width: 46px; text-align: center; border-bottom: 3px solid #d9d0bd; }
.rules ol { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; line-height: 1.6; }
.rules li { display: grid; grid-template-columns: 28px 1fr; }
.rules h3 { margin: 0 0 12px; font-family: var(--f-display); font-weight: 400; font-size: 24px; color: #6b3a10; }
.quiz { font-family: var(--f-hand); font-size: 26px; line-height: 1.6; }
.quiz h3 { margin: 0 0 6px; font-size: 30px; }
.calli { background: #efe6cf; color: #1d140e; font-family: var(--f-brush); font-size: 40px; line-height: 1.35; text-align: center; padding: 26px 16px; border-radius: 4px; border: 1px solid #c9b78f; }
.note { background: #ffe680; color: #3a2b10; font-family: var(--f-hand); font-size: 28px; padding: 16px 20px; border-radius: 3px; transform: rotate(-1deg); box-shadow: 0 6px 14px rgba(0,0,0,.35); text-align: center; }
.led { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; background: #0d0606; border: 3px solid var(--gold); border-radius: 8px; padding: 12px 8px; }
.led span { font-family: var(--f-arcade); font-size: 22px; text-align: center; color: #ffd36b; background: #2a0f0f; border-radius: 3px; padding: 6px 0; text-shadow: 0 0 8px rgba(255,160,60,.8); }
@media (max-width: 560px) { .led { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.cards { background: var(--felt); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; color: #eaf3ee; }
.hand { display: flex; flex-direction: column; gap: 6px; }
.hand .who { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; color: #bfe3d2; }
.hand .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pc { width: 38px; height: 54px; background: #fbf8f1; color: #1a1a1a; border-radius: 5px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 18px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.arrow { color: #bfe3d2; font-size: 12px; }
.order { font-family: var(--f-mono); font-size: 13px; color: #bfe3d2; border-top: 1px dashed rgba(234,243,238,.3); padding-top: 10px; }
.venn { background: var(--paper); border-radius: 6px; padding: 16px; display: grid; place-items: center; }
.venn svg { width: min(360px, 100%); height: auto; }
.holdem { background: radial-gradient(ellipse at center, #1f6a52, #0f3b2e); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 14px; color: #eaf3ee; }
.holdem .tbl { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.holdem .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: #bfe3d2; text-align: center; }
.holdem .bigc { width: 54px; height: 78px; font-size: 28px; }
.holdem .back { background: repeating-linear-gradient(45deg, #8c1d1d 0 6px, #a82a2a 6px 12px); color: #ffd9a0; }
.holdem .side { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-mono); font-size: 13px; min-width: 112px; }
.holdem .side div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid rgba(234,243,238,.15); padding-bottom: 4px; }
.holdem .acts { display: flex; gap: 6px; margin-top: 6px; }
.holdem .acts span { font-size: 11px; padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(234,243,238,.35); }
.holdem .acts .fold { border-color: var(--bad); color: #ffb0b0; }
@media (max-width: 520px) { .holdem { grid-template-columns: 1fr; } .holdem .side { min-width: 0; } }
.qtext { line-height: 1.7; font-size: 14px; }
.qtext b { color: var(--gold); font-weight: 600; }
</style>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="../engine/engine.js"></script>
<script src="theme.js"></script>
</body>
</html>
