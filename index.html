<!doctype html>
<html lang="ko">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Back Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Theme select: a dark backstage wall with six "rooms" in series order. Only playable rooms are links. */
:root {
  color-scheme: dark;
  --bg: #0f0b0a;
  --bg-2: #171110;
  --card: #1c1513;
  --card-2: #241a17;
  --line: #3a2b25;
  --text: #f2e6d4;
  --muted: #a8968a;
  --gold: #f2b84b;
  --red: #d8463c;
  --f-display: 'Bungee', 'IBM Plex Sans KR', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --f-body: 'IBM Plex Sans KR', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--f-body); line-height: 1.6;
  background-image:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(242,184,75,.16), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 46px);
}
.wrap { width: min(1180px, 100%); margin: 0 auto; padding: 56px max(16px, env(safe-area-inset-left, 0px)) 72px max(16px, env(safe-area-inset-right, 0px)); }

header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin-bottom: 40px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .18em; color: var(--gold); }
h1 { margin: 6px 0 10px; font-family: var(--f-display); font-weight: 400; font-size: clamp(48px, 9vw, 104px); line-height: .9; letter-spacing: .01em; color: #ffe9b8; text-shadow: 0 0 28px rgba(242,140,60,.35); }
.lede { margin: 0; color: #d9c9b6; max-width: 56ch; }
.progress { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-family: var(--f-mono); }
.progress b { font-size: 34px; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
.progress span { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.pips { display: flex; gap: 5px; }
.pips i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--gold); }

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.room { position: relative; display: flex; flex-direction: column; height: 100%; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); color: inherit; text-decoration: none; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
a.room:hover, a.room:focus-visible { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 14px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(242,184,75,.25); outline: none; }
.thumb { position: relative; aspect-ratio: 16 / 9; background: #000; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.room.locked .thumb img { filter: grayscale(.85) brightness(.45); }
.room.locked .thumb::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(0,0,0,.25) 0 6px, transparent 6px 12px); }
.wk { position: absolute; left: 12px; top: 12px; z-index: 1; font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .1em; background: rgba(15,11,10,.82); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.pill { position: absolute; right: 12px; top: 12px; z-index: 1; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: rgba(15,11,10,.82); border: 1px solid var(--line); color: var(--muted); }
.pill.play { background: var(--gold); border-color: var(--gold); color: #24160b; }
.pill.wip { color: var(--gold); border-color: rgba(242,184,75,.5); }
.pill.clear { background: #2f6b45; border-color: #3f8a5a; color: #e6ffe9; }
.body { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 18px; flex: 1; }
.body h2 { margin: 0; font-size: 21px; line-height: 1.25; text-wrap: balance; }
.body h2 small { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--muted); }
.body h2.en { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; color: #ffe9b8; }
.body p { margin: 0; font-size: 14px; color: #cdbcaa; }
.room.locked .body p, .room.locked h2 { color: #8f8076; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 6px; }
.chips span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; font-size: 13px; }
.foot .rec { font-family: var(--f-mono); color: var(--gold); font-variant-numeric: tabular-nums; }
.foot .rec.none { color: var(--muted); font-family: var(--f-body); }
.foot .go { font-weight: 600; color: var(--gold); }
.room.locked .foot .go { color: var(--muted); font-weight: 400; }

footer { margin-top: 40px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
footer kbd { font-family: var(--f-mono); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

@media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) {
  .wrap { padding-top: 32px; }
  header { grid-template-columns: 1fr; gap: 16px; margin-bottom: 28px; }
  .progress { align-items: flex-start; flex-direction: row; align-items: center; gap: 10px; }
  .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .room { transition: none; } a.room:hover { transform: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">BACK STAGE · 방탈출 시리즈</div>
      <h1>BACK STAGE</h1>
      <p class="lede">지나온 시간 속으로 들어가는 여섯 개의 방. 방마다 자물쇠가 여섯 개, 제한 시간은 60분입니다. 흩어진 단서를 모아 문을 열고 다음 기억으로 넘어가세요.</p>
    </div>
    <div class="progress" aria-label="탈출한 방 수">
      <b id="clearN">0 / 6</b>
      <div class="pips" id="pips"></div>
      <span>탈출한 방</span>
    </div>
  </header>

  <ol class="grid" id="grid"></ol>

  <footer>
    <span>PC 권장 · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동, 마우스로 시점</span>
    <span>휴대폰은 조이스틱과 화면 끌기로 플레이</span>
    <span>기록은 이 브라우저에만 저장됩니다</span>
  </footer>
</div>

<script>
(() => {
'use strict';

/* Series order follows the renumbered source doc (1~6주차). `href` set = playable. */
const THEMES = [
  { wk: 1, title: 'CLASSROOM', sub: '타임고등학교 3학년 4반', href: 'w1/index.html', poster: 'w1/assets/poster.webp',
    story: '졸업한 교실에 다시 왔다. 반장이자 모범생이었지만, 대학만 가면 된다며 숨 막히게 볶던 학교였다.',
    locks: ['방향', '숫자 4 ×2', '숫자 5', '한글 4', '입력 2칸'] },
  { wk: 2, title: 'PUB', sub: '대학 시절 단골 술집', href: 'w2/index.html', poster: 'w2/assets/poster.webp',
    story: '대학 때 단골 술집. 베스트셀러 작가를 꿈꾸며 밤새 떠들던 그 시절로 돌아간다.',
    locks: ['숫자 4 ×2', '숫자 5', '대문자 5', '소문자 6', '소문자 4'] },
  { wk: 3, title: 'DESK', sub: '게임 기획 혹평', href: 'w3/index.html', poster: 'w3/assets/poster.webp',
    story: '시간을 소재로 짠 게임 기획이 혹평을 받았다. 커서만 깜빡이는 책상 앞, 한 달의 노력이 날아갔다.',
    locks: ['한글 4', '대문자 5', '한글 3', '숫자 5', '대문자 4', '대문자 7'] },
  { wk: 4, title: 'MONITOR', sub: '출간 원고의 혹평', href: 'w4/index.html', poster: 'w4/assets/poster.jpg',
    story: '세상에 내놓은 원고가 차가운 혹평을 받았다. 어긋난 뼈대를 바로잡고, 이번에는 모니터를 끄지 않는다.',
    locks: ['대문자 4 ×3', '숫자 4', '숫자 3', '방향'] },
  { wk: 5, title: 'STAGE', sub: '나다운 길', href: 'w5/index.html', poster: 'w5/assets/poster.webp',
    story: '남들이 괜찮다는 길만 따라가다 나다운 삶을 잊었다. 이번엔 내 발걸음이 향하는 방향을 따라가 본다.',
    locks: ['숫자 5', '대문자 5 ×5'] },
  { wk: 6, title: 'TIME CASINO', sub: '쉬는 시간의 내기', href: 'w6/index.html', poster: 'w6/assets/poster.webp',
    story: '공부만 하던 곳이라 기억했던 학교. 쉬는 시간마다 친구들과 걸던 사소한 내기가 카지노가 되어 펼쳐진다.',
    locks: ['숫자 4', '대문자 8', '대문자 5', '대문자 4', '숫자 키패드', '대문자 키패드'] },
];

function record(wk) {
  try { return JSON.parse(localStorage.getItem('bs-record-w' + wk) || 'null'); } catch (e) { return null; }
}
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

/* ---------- render cards */
const grid = document.getElementById('grid');
let cleared = 0;
for (const t of THEMES) {
  const rec = record(t.wk), playable = !!t.href;
  if (rec) cleared++;
  const li = document.createElement('li');
  const el = document.createElement(playable ? 'a' : 'article');
  el.className = `room ${playable ? '' : 'locked'}`;
  if (playable) { el.href = t.href; el.setAttribute('aria-label', `${t.wk}주차 ${t.title} 플레이`); }
  else el.setAttribute('aria-disabled', 'true');
  const pill = rec ? ['clear', '탈출 성공'] : playable ? ['play', '플레이'] : ['', '준비 중'];
  el.innerHTML = `
    <div class="thumb"><span class="wk">${t.wk}주차</span><span class="pill ${pill[0]}">${pill[1]}</span>
      <img src="${t.poster}" alt="${t.title} 테마 이미지" loading="lazy"></div>
    <div class="body">
      <h2 class="en">${t.title}<small>${t.sub}</small></h2>
      <p>${t.story}</p>
      <div class="chips" aria-label="자물쇠 구성">${t.locks.map(l => `<span>${l}</span>`).join('')}</div>
      <div class="foot">
        ${rec ? `<span class="rec">최고 ${fmt(rec.time)} · ${rec.grade}</span>` : `<span class="rec none">${playable ? '아직 기록 없음' : '곧 열립니다'}</span>`}
        <span class="go">${playable ? (rec ? '다시 도전 →' : '입장 →') : '잠김'}</span>
      </div>
    </div>`;
  li.appendChild(el); grid.appendChild(li);
}
document.getElementById('clearN').textContent = `${cleared} / ${THEMES.length}`;
document.getElementById('pips').innerHTML = THEMES.map(t => `<i class="${record(t.wk) ? 'on' : ''}"></i>`).join('');
})();
</script>
